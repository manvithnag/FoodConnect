
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard – FoodConnect</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap"
    rel="stylesheet">

  <link rel="icon" type="image/png" href="../assets/images/logo.png">

  <link rel="stylesheet" href="../styles/common/global.css">
  <link rel="stylesheet" href="../styles/common/layout.css">
  <link rel="stylesheet" href="../styles/components/cards.css">
  <link rel="stylesheet" href="../styles/components/badges.css">
  <link rel="stylesheet" href="../styles/pages/dashboard.css">
  <link rel="stylesheet" href="../styles/components/forms.css">
  <link rel="stylesheet" href="../styles/components/welcome-modal.css">
  <link rel="stylesheet" href="../styles/common/responsive.css">
</head>

<body data-page="dash">

  <!-- Header and navigation -->
  <header>
    <div class="logo"
         onclick="go('home')"
         onkeydown="if(event.key==='Enter')go('home')"
         tabindex="0"
         role="link">
      <img class="logo-img"
           src="../assets/images/logo.png"
           alt=""
           width="40"
           height="45">
      <span class="logo-txt">Food<span>Connect</span></span>
    </div>

    <button class="burger"
            id="burger"
            aria-label="Open menu"
            aria-expanded="false"
            aria-controls="nav"
            onclick="toggleMenu()">
      <span></span><span></span><span></span>
    </button>

    <nav id="nav"></nav>
  </header>

  <div class="backdrop" id="backdrop" onclick="toggleMenu(false)"></div>

  <!-- Dashboard content is generated by dashboard.js -->
  <main>
    <section id="dash">
      <div class="wrap" id="dashBody"></div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <img class="foot-logo"
         src="../assets/images/logo.png"
         alt="FoodConnect logo"
         width="56"
         height="63">

    <p><b>FoodConnect</b> is a non-profit food redistribution platform.</p>
    <p>
      Reduce food waste. Increase social impact.
      Connect surplus food with those who need it most.
    </p>
  </footer>

  <!-- Welcome login popup -->
  <div class="modal"
       id="welcome"
       role="dialog"
       aria-modal="true"
       aria-labelledby="wTitle"
       hidden>

    <div class="modal-box">
      <button class="modal-x"
              type="button"
              aria-label="Close"
              onclick="closeWelcome()">
        &times;
      </button>

      <img class="modal-logo"
           src="../assets/images/logo.png"
           alt="FoodConnect logo"
           width="72"
           height="80">

      <h2 id="wTitle">Welcome to FoodConnect</h2>
      <p class="wsub">Log in to donate or request food.</p>

      <div class="msg" id="wMsg" role="alert"></div>

      <form id="wForm">
        <div class="roles">
          <label class="ro">
            <input type="radio" name="wrole" value="donor" checked>
            <span>🍲<b>Donor</b></span>
          </label>

          <label class="ro">
            <input type="radio" name="wrole" value="recipient">
            <span>🏛️<b>Organisation</b></span>
          </label>

          <label class="ro">
            <input type="radio" name="wrole" value="admin">
            <span>🛡️<b>Admin</b></span>
          </label>
        </div>

        <label>
          Email
          <input type="email" id="wEmail" autocomplete="username" required>
        </label>

        <label>
          Password
          <input type="password" id="wPass" autocomplete="current-password" required>
        </label>

        <button class="btn dk">Log in</button>
      </form>

      <p class="wlinks">
        New here?
        <a href="register.html" onclick="closeWelcome()">Create an account</a>
      </p>

      <button type="button" class="later" onclick="closeWelcome()">
        Maybe later
      </button>
    </div>
  </div>

  <!-- Shared scripts load before dashboard logic -->
  <script src="../scripts/common/helpers.js"></script>
  <script src="../scripts/common/data.js"></script>
  <script src="../scripts/common/navigation.js"></script>
  <script src="../scripts/pages/dashboard.js"></script>
  <script src="../scripts/common/welcome.js"></script>
  <script src="../scripts/common/keyboard-shortcuts.js"></script>
</body>
</html>
